name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the offline voice model (only used while building)
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          rm model.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: ASH-PHONE-CONTROL-APP
          path: app/build/outputs/apk/debug/app-debug.apk
